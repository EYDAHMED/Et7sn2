name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Initialize Android & Dependencies
      run: |
        cd et7sn_complete_with_icon
        flutter create --platforms=android .
        sed -i 's/ios: true/ios: false/g' pubspec.yaml
        
        # ضبط إعدادات الـ Android لتتوافق مع الحزم الحديثة وتجنب أخطاء البناء
        echo "android.minSdkVersion = 21" >> android/local.properties
        echo "flutter.minSdkVersion = 21" >> android/local.properties
        
        # تحديث ملف build.gradle الخاص بالتطبيق لضمان توافق الإصدارات
        if [ -f "android/app/build.gradle" ]; then
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
        fi
        
        flutter pub run flutter_launcher_icons
        flutter pub get

    - name: Build APK
      run: |
        cd et7sn_complete_with_icon
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: et7sn_complete_with_icon/build/app/outputs/flutter-apk/app-release.apk
