name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Initialize Android & Dependencies
      run: |
        cd et7sn_complete_with_icon
        
        # إنشاء مشروع أندرويد
        flutter create --platforms=android --org com.et7sn.app .
        
        # تعطيل أيقونات الآيفون لتفادي الأخطاء
        sed -i 's/ios: true/ios: false/g' pubspec.yaml

        # حل نهائي لمشكلة compileSdkVersion والـ flutter extension لمكتبة geolocator
        APP_GRADLE="android/app/build.gradle"
        if [ -f "$APP_GRADLE" ]; then
          # إضافة إعدادات الـ android و compileSdkVersion بشكل صريح يمنع الخطأ تماماً
          echo "android { compileSdkVersion 34 }" >> $APP_GRADLE
        fi

        # إضافة ملف local.properties لتعريف مسار فلاتر وحل مشاكل الـ gradle
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

        flutter pub run flutter_launcher_icons
        flutter pub get

    - name: Build APK
      run: |
        cd et7sn_complete_with_icon
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: et7sn_complete_with_icon/build/app/outputs/flutter-apk/app-release.apk
