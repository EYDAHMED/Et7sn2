name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'      # latest stable, no pinned old version
        cache: true

    - name: Initialize Android & Dependencies
      run: |
        cd et7sn_complete_with_icon

        flutter create --platforms=android --org com.et7sn.app .

        flutter pub get
        dart run flutter_launcher_icons

    - name: Build APK
      run: |
        cd et7sn_complete_with_icon
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: et7sn_complete_with_icon/build/app/outputs/flutter-apk/app-release.apk
